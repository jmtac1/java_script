<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro programa</title>
    <style>
        body {
            background-color: bisque;
            color: teal;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <h1>Primeiro script de java script</h1>
    <p>comandos: window.alert(), window.confirm() e window.prompt()</p>
    <script>
        window.alert("mensagem de alerta!")
        window.confirm("mensagem de confirmação")
        window.prompt("qual seu nome?")
    </script>
</body>
</html>
