<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adivinhador de números</title>
</head>
<body>
    <main>
        <h1 id="res"></h1>
    </main>
    <script>
        let num = window.prompt('digite um número de 1 a 10');
        let numero = Number(num);
        let = numeroAleatorio = Math.floor(Math.random() * 10) + 1;
        let tenteativas = 1;
        const res = document.getElementById('res');

        while (numero != numeroAleatorio) {
            if (numero > numeroAleatorio) {
                num = window.prompt('muito alto, tente novamente!');
            } else if (isNaN(numero)) {
                num = window.prompt(`o valor indicado não é um número, tente novamente!`);
            } else {
                num = window.prompt('muito baixo, tente novamente!');
            }

            tenteativas ++;
            numero = Number(num);        
        }
        res.textContent = `você acertou, foram ${tenteativas} tentativas`
    </script>
</body>
</html>
