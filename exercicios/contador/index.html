<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contador</h1>
    </header>
    <main>
        <p>
            <label for="ini">Início: </label> <br>
            <input type="number" name="ini" id="ini">
        </p>
        <p>
            <label for="fim">Fim: </label> <br>
            <input type="number" name="fim" id="fim">
        </p>
        <p>
            <label for="pas">Passo: </label> <br>
            <input type="number" name="pas" id="pas">
        </p>
        <p>
            <input type="button" value="contar" onclick="contar()">
        </p>
        <p id="msg">Esperando contagem...</p>
        <p id="cont"></p>
        <p id="f"></p>
    </main>
    <footer>Criado por João Manoel</footer>
    <script src="script.js"></script>
</body>
</html>
