<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            font-size: 3rem;
            border: none;
            border-radius: 10px;

            padding: 10px;

        .ativo {
            background-color: navy;
            color: white;
        }
        .hover {
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.222);
            font-weight: bold;
        }
        .desativo {
            background-color: grey;
            color: black;
        }
    </style>
</head>
<body>
    <h1 id="h1">titulo</h1>
    <button class="botao">botão 1</button>
    <button class="botao">botão 2</button>
    <button class="botao">botão 3</button>
    <button class="botao">botão 4</button>

</html>
